tank_i2c_odom:
  ros__parameters:

    i2c_device: "/dev/i2c-1"
    i2c_address: 52

    # =====================================================
    # ROBOT
    # =====================================================

    wheel_diameter: 0.05
    track_width: 0.10

    # =====================================================
    # ENCODER
    # =====================================================

    # Valor inicial.
    # Lo vamos a calibrar posteriormente.
    ticks_per_revolution: 1980.0

    # =====================================================
    # MOTOR
    # =====================================================

    gear_ratio: 45.0

    # =====================================================
    # FRAMES
    # =====================================================

    base_frame: "base_link"
    odom_frame: "odom"

    # =====================================================
    # ENCODER POLARITY
    # =====================================================

    left_encoder_sign: 1
    right_encoder_sign: 1

    # =====================================================
    # PUBLICACION
    # =====================================================

    publish_tf: true
    publish_odom: true
    publish_rate: 50.0
