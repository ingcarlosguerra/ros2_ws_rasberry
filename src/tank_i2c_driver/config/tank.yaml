tank_i2c_driver:
  ros__parameters:

    # =====================================================
    # I2C
    # =====================================================

    i2c_device: "/dev/i2c-1"
    i2c_address: 52

    # =====================================================
    # ROBOT
    # =====================================================

    max_linear_speed: 0.30
    max_angular_speed: 6.0

    track_width: 0.10
    wheel_diameter: 0.05

    # =====================================================
    # ENCODER
    # =====================================================

    # Valor inicial.
    # Se calibrará posteriormente.
    ticks_per_revolution: 1980.0

    # =====================================================
    # MOTOR
    # =====================================================

    max_motor_speed: 50

    # =====================================================
    # POLARIDAD
    # =====================================================

    left_motor_sign: 1
    right_motor_sign: 1

    left_encoder_sign: 1
    right_encoder_sign: 1

    # =====================================================
    # FRECUENCIAS
    # =====================================================

    motor_rate: 100.0
    encoder_rate: 20.0

    # =====================================================
    # FRAMES
    # =====================================================

    odom_frame: "odom"
    base_frame: "base_link"

    # =====================================================
    # TF
    # =====================================================

    publish_tf: true

    # =====================================================
    # WATCHDOG
    # =====================================================

    watchdog_timeout: 0.25

